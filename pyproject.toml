[project]
name = "jit"
version = "0.1.0"
description = "Just image Transformer for pixel-space diffusion"
requires-python = ">=3.10,<3.11"
dependencies = [
    # CUDA 12.8 wheels add support for NVIDIA Blackwell GPUs.
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy==1.22.4",
    "opencv-python==4.11.0.86",
    "timm==0.9.12",
    "tensorboard==2.10.0",
    "scipy==1.9.1",
    "einops==0.8.1",
    "gdown==5.2.0",
    "torch-fidelity",
    # TensorBoard 2.10 imports pkg_resources, removed in setuptools 82.
    "setuptools<81",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torch-fidelity = { git = "https://github.com/LTH14/torch-fidelity.git", branch = "master" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
